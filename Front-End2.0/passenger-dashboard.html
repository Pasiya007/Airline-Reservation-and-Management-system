<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Passenger Dashboard - SkyWings Airlines</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <!-- Navigation -->
    <nav class="navbar">
        <div class="nav-container">
            <div class="logo">
                <span class="logo-icon">✈️</span>
                <span class="logo-text">SkyWings Airlines</span>
            </div>
            <div class="nav-user">
                <span id="userName">Passenger</span>
                <button class="btn-logout" onclick="logout()">Logout</button>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <div class="dashboard-container">
        <div class="dashboard-header">
            <h1>Welcome, <span id="userFirstName">Passenger</span>!</h1>
            <p>Manage your bookings and explore new destinations</p>
        </div>
        
        <!-- My Tickets Section -->
        <section class="section-box">
            <div class="section-header">
                <h2>🎫 My Tickets</h2>
                <span class="badge" id="ticketCount">0 Tickets</span>
            </div>
            
            <div id="ticketsContainer" class="tickets-grid">
                <!-- Tickets loaded by JavaScript -->
            </div>

            <div id="noTickets" class="empty-state" style="display: none;">
                <div class="empty-icon">📭</div>
                <p>No tickets yet. Book your first flight!</p>
                <button onclick="scrollToBooking()" class="btn-primary">Book a Flight</button>
            </div>
        </section>

        <!-- Book Flight Section -->
        <section class="section-box" id="bookingSection">
            <div class="section-header">
                <h2>🛫 Book a New Flight</h2>
            </div>

            <!-- Flight Filters -->
            <div class="filters-row">
                <select id="filterOrigin" onchange="filterFlights()">
                    <option value="">All Origins</option>
                    <option value="JFK">New York (JFK)</option>
                    <option value="LAX">Los Angeles (LAX)</option>
                    <option value="MIA">Miami (MIA)</option>
                </select>

                <select id="filterDestination" onchange="filterFlights()">
                    <option value="">All Destinations</option>
                    <option value="LAX">Los Angeles (LAX)</option>
                    <option value="LHR">London (LHR)</option>
                    <option value="CDG">Paris (CDG)</option>
                </select>

                <button onclick="resetFilters()" class="btn-secondary">Reset</button>
            </div>

            <!-- Available Flights -->
            <div id="flightsContainer" class="flights-grid">
                <!-- Flights loaded by JavaScript -->
            </div>
        </section>
    </div>

    <!-- Booking Modal -->
    <div id="bookingModal" class="modal">
        <div class="modal-content">
            <span class="modal-close" onclick="closeModal()">&times;</span>
            <h3>Complete Your Booking</h3>
            
            <div id="flightSummary" class="flight-summary"></div>

            <form id="bookingForm" onsubmit="confirmBooking(event)">
                <div class="form-group">
                    <label>Ticket Class</label>
                    <select id="ticketClass" onchange="updatePrice()">
                        <option value="economy">Economy - $299</option>
                        <option value="business">Business - $899</option>
                        <option value="first">First Class - $1,499</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>Passengers</label>
                    <input type="number" id="passengers" min="1" max="9" value="1" onchange="updatePrice()">
                </div>

                <div class="price-display">
                    <strong>Total Price: $<span id="totalPrice">299</span></strong>
                </div>

                <button type="submit" class="btn-primary">Confirm Booking</button>
            </form>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
